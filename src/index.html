<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patch Viewer</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <header class="toolbar">
    <!-- The version and the commit hash are written by showBuildInfo() from
         values the build script injects, so nothing here needs touching when
         the version changes.

         The GitHub link ships pointing at the repository root and is rewritten
         once the bundle runs to whatever the figures beside it name: a working
         link either way.

         Both marks are inline SVG because the CSP in _headers sets
         `img-src 'self' data:`, which rules out pulling them from anywhere
         else. They carry aria-hidden since each already sits beside its label.

         A label written as `Text<span class="lbl-wide">tail</span>` gives up
         its tail once the bar is squeezed. Where no tail reads on its own, a
         `.lbl-narrow` span carries a replacement wording instead. Which of the
         two shows is decided entirely in the stylesheet. -->
    <div class="brand-cluster">
      <span class="brand">Patch Viewer<span class="brand-version">v<span id="app-version"></span> <span class="brand-hash" id="app-commit" hidden></span></span></span>

      <span class="tdivider"></span>

      <span class="tmeta">
        <a id="repo-link" href="https://github.com/Ming-Hao/gitpatch-viewer"
           target="_blank" rel="noopener noreferrer">
          <svg class="mark mark-gh" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27s-1.36.09-2 .27c-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
          GitHub
        </a>

        <span class="tdivider"></span>

        <span>
          <svg class="mark mark-cf" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.4 7.05a4.02 4.02 0 0 0-7.63-1.1A3.2 3.2 0 0 0 3.4 12.2h8.7a2.58 2.58 0 0 0 .3-5.15Z"/></svg>
          <span class="lbl-wide">Cloudflare Workers</span><span class="lbl-narrow">Cloudflare</span>
        </span>
      </span>
    </div>

    <div class="toolbar-group">
      <div class="segmented" id="view-toggle" role="group" aria-label="View mode">
        <button type="button" data-mode="unified" class="is-active">Unified</button>
        <button type="button" data-mode="split"><span class="lbl-wide">Side by side</span><span class="lbl-narrow">Split</span></button>
      </div>

      <button type="button" class="btn" id="theme-toggle" title="Toggle theme">Theme</button>
      <label class="btn" for="file-input">Open<span class="lbl-wide"> patch</span></label>
      <button type="button" class="btn" id="reset-btn" hidden>Clear</button>
    </div>
  </header>

  <input type="file" id="file-input" accept=".patch,.diff,text/plain" hidden>

  <!-- The totals are filled in by showSummary(); everything after the spacer is
       static, so the controls survive a re-render of the figures. Each control
       carries its own tooltip, whose two halves are written by applyScale() and
       applyFocus() so they always describe the state actually in effect. -->
  <div class="summary" id="summary" hidden>
    <span id="summary-totals"></span>
    <span class="summary-spacer"></span>

    <span class="ctl">
      <button type="button" class="textbtn" id="scale-toggle"></button>
      <span class="tip" role="tooltip">
        <span class="tip-now"></span>
        <span class="tip-then"></span>
      </span>
    </span>

    <span class="ctl">
      <button type="button" class="textbtn" id="focus-toggle" aria-pressed="true"></button>
      <span class="tip" role="tooltip">
        <span class="tip-now"></span>
        <span class="tip-then"></span>
      </span>
    </span>
  </div>

  <main id="main">
    <section class="intro" id="intro">
      <div class="dropzone" id="dropzone">
        <p class="dropzone-title">Drop a <code>.patch</code> file here</p>
        <p class="dropzone-sub">or <label class="link" for="file-input">choose a file</label></p>
      </div>

      <details class="paste">
        <summary>Paste patch text instead</summary>
        <textarea id="paste-area" spellcheck="false"
                  placeholder="diff --git a/src/app.js b/src/app.js&#10;index 83db48f..f735c4e 100644&#10;--- a/src/app.js&#10;+++ b/src/app.js&#10;@@ -12,3 +12,3 @@"></textarea>
        <button type="button" class="btn" id="paste-btn">Render</button>
      </details>
    </section>

    <div class="error" id="error" hidden></div>
    <div id="files"></div>
  </main>

  <div class="drop-overlay" id="drop-overlay" hidden><span>Drop to open</span></div>

  <script src="./app.js"></script>
</body>
</html>
